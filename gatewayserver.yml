server:
  port: 8072

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
          filters:
            - StripPrefix=1

      server:
        webmvc:
          routes:
            - id: accounts_route
              uri: lb://ACCOUNTS
              predicates:
                - Path=/accounts/**
              filters:
                - StripPrefix=1

            - id: cards_route
              uri: lb://CARDS
              predicates:
                - Path=/cards/**
              filters:
                - StripPrefix=1

            - id: loans_route
              uri: lb://LOANS
              predicates:
                - Path=/loans/**
              filters:
                - StripPrefix=1

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
